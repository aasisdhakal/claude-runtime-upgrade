name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '23 5 * * 2'
  push: { branches: [ main ] }

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # Scorecard publishes to a public registry and CodeQL needs Advanced
    # Security on a private repo — both fail until this repo is public, so
    # skip rather than show a permanent red X. They activate on the flip.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write          # OIDC - publishes the result, no stored secret
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@16140ae1a102900babc80a33c44059580f687047 # v3.29.5
        with: { sarif_file: results.sarif }
