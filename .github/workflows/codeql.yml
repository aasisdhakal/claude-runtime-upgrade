name: CodeQL

on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }
  schedule:
    - cron: '27 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    # Scorecard publishes to a public registry and CodeQL needs Advanced
    # Security on a private repo — both fail until this repo is public, so
    # skip rather than show a permanent red X. They activate on the flip.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # required to upload the SARIF result
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]   # adjust to your languages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3.29.5
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@16140ae1a102900babc80a33c44059580f687047 # v3.29.5
