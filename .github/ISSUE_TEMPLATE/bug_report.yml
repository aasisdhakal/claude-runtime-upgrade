name: Bug report
description: Something does not work as documented
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Never paste credentials, tokens or internal hostnames here.**
        For security vulnerabilities, follow SECURITY.md instead of opening an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "e.g. 1.2.3, or a commit SHA"
    validations: { required: true }
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, runtime version, how you installed it"
